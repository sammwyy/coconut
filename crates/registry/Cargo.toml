[package]
name = "coconut-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
coconut-api = { workspace = true }
coconut-integration-system = { workspace = true, optional = true }
coconut-integration-mpris = { workspace = true, optional = true }
coconut-integration-upower = { workspace = true, optional = true }
coconut-integration-bluez = { workspace = true, optional = true }
coconut-integration-brightnessctl = { workspace = true, optional = true }
coconut-integration-network-manager = { workspace = true, optional = true }
coconut-integration-power-profiles-daemon = { workspace = true, optional = true }
coconut-integration-pipewire = { workspace = true, optional = true }
coconut-integration-kwin = { workspace = true, optional = true }
coconut-integration-blair = { workspace = true, optional = true }
coconut-integration-windows = { workspace = true, optional = true }
coconut-integration-notifications = { workspace = true, optional = true }

[features]
default = [
    "system",
    "notifications",
    "mpris",
    "upower",
    "bluez",
    "brightnessctl",
    "network-manager",
    "power-profiles-daemon",
    "pipewire",
    "kwin",
    "blair",
]
system = ["dep:coconut-integration-system"]
mpris = ["dep:coconut-integration-mpris"]
upower = ["dep:coconut-integration-upower"]
bluez = ["dep:coconut-integration-bluez"]
brightnessctl = ["dep:coconut-integration-brightnessctl"]
network-manager = ["dep:coconut-integration-network-manager"]
power-profiles-daemon = ["dep:coconut-integration-power-profiles-daemon"]
pipewire = ["dep:coconut-integration-pipewire"]
kwin = ["dep:coconut-integration-kwin"]
blair = ["dep:coconut-integration-blair"]
windows = ["dep:coconut-integration-windows"]
notifications = ["dep:coconut-integration-notifications"]

[lints]
workspace = true
