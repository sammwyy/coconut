[package]
name = "coconut-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["theme-watch"]
theme-watch = ["dep:creamui-theme-watch"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
dbus.workspace = true
serde_json.workspace = true
delib = { workspace = true }
creamui-theme-watch = { workspace = true, optional = true }
blair-protocol = { workspace = true }
