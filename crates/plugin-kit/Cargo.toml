[package]
name = "coconut-plugin-kit"
version = "0.1.0"
edition = "2021"
description = "Island/Panel/Plugin traits, registry, SharedState and PanelHost shared by every Coconut plugin crate"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
coconut-core = { workspace = true }
delib = { workspace = true }
creamui-core = { workspace = true }
creamui-fonts = { workspace = true }
creamui-image = { workspace = true, features = ["webp", "jpeg", "svg"] }
creamui-jsx = { workspace = true }
creamui-macros = { workspace = true }
creamui-reactive = { workspace = true }
creamui-render = { workspace = true }
creamui-theme = { workspace = true }
creamui-widgets = { workspace = true }
serde = { workspace = true, features = ["derive"] }
