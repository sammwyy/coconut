[package]
name = "coconut-greeter"
version.workspace = true
edition.workspace = true
description = "Coconut login interface for Alphin"
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "coconut-greeter"
path = "src/main.rs"

[dependencies]
alphin = { workspace = true }
anyhow.workspace = true
creamui-core = { workspace = true }
creamui-fonts = { workspace = true }
creamui-image = { workspace = true, features = ["webp", "svg"] }
creamui-reactive = { workspace = true }
creamui-render = { workspace = true, default-features = true, features = ["platform-wayland", "system-theme"] }
creamui-theme = { workspace = true }
creamui-widgets = { workspace = true }
serde_json.workspace = true

[lints]
workspace = true
