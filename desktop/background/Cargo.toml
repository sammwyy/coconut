[package]
name = "coconut-background"
version = "0.1.0"
edition = "2021"
description = "Coconut's standalone Wayland background renderer"
license = "Apache-2.0"

[[bin]]
name = "coconut-bg"
path = "src/main.rs"

[dependencies]
coconut-core = { workspace = true, default-features = false }
image.workspace = true
smithay-client-toolkit.workspace = true
wayland-client = { workspace = true, features = ["system"] }
pollster.workspace = true
raw-window-handle.workspace = true
wgpu = { workspace = true, default-features = false, features = ["wgsl"] }
