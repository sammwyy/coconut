[package]
name = "coconut-shell"
version.workspace = true
edition.workspace = true
description = "Coconut's dock/bar process"
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "coconut"
path = "src/main.rs"

[features]
perf-metrics = [
    "creamui-core/perf-metrics",
    "creamui-render/perf-metrics",
    "creamui-devtools/perf-metrics",
    "dep:creamui-devtools",
]

[dependencies]
coconut-file-menu.workspace = true
coconut-thumbnails.workspace = true
coconut-theme.workspace = true
coconut-integration-cream.workspace = true
coconut-api = { workspace = true }
coconut-core = { workspace = true, default-features = true }
coconut-plugin-kit = { workspace = true }
delib = { workspace = true }
coconut-plugin-workspaces = { workspace = true }
coconut-plugin-clock = { workspace = true }
coconut-plugin-weather = { workspace = true }
coconut-plugin-current-playing = { workspace = true }
coconut-plugin-app-launcher = { workspace = true }
coconut-plugin-app-drawer = { workspace = true }
coconut-plugin-tray = { workspace = true }
chrono.workspace = true
mime_guess.workspace = true
toml.workspace = true
creamui-core = { workspace = true }
creamui-devtools = { workspace = true, optional = true }
creamui-fonts = { workspace = true }
creamui-image = { workspace = true, features = ["webp", "jpeg", "svg"] }
creamui-jsx = { workspace = true }
creamui-macros = { workspace = true }
creamui-reactive = { workspace = true }
creamui-render = { workspace = true, default-features = true, features = ["platform-wayland", "platform-blur-blair", "platform-blur-kwin", "system-theme"] }
creamui-theme = { workspace = true }
creamui-theme-loader = { workspace = true }
creamui-widgets = { workspace = true }
serde.workspace = true
blair-client = { workspace = true }
blair-protocol = { workspace = true }
coconut-integration-kwin = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
zbus.workspace = true

[target.'cfg(not(target_os = "windows"))'.dependencies]
coconut-registry = { workspace = true, default-features = true }

[target.'cfg(target_os = "linux")'.dependencies]
coconut-integration-appearance.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
coconut-registry = { workspace = true, default-features = false, features = ["windows"] }

[lints]
workspace = true
