[package]
name = "coconut-plugin-weather"
version = "0.1.0"
edition = "2021"
description = "Coconut dock plugin: the weather island and panel"
license = "Apache-2.0"

[dependencies]
coconut-core = { workspace = true }
coconut-plugin-kit = { workspace = true }
chrono.workspace = true
creamui-core = { workspace = true }
creamui-jsx = { workspace = true }
creamui-macros = { workspace = true }
creamui-reactive = { workspace = true }
creamui-theme = { workspace = true }
creamui-widgets = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["blocking", "gzip", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
