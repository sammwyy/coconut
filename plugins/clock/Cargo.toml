[package]
name = "coconut-plugin-clock"
version = "0.1.0"
edition = "2021"
description = "Coconut dock plugin: the clock island and panel"
license = "Apache-2.0"

[dependencies]
coconut-plugin-kit = { workspace = true }
chrono.workspace = true
creamui-core = { workspace = true }
creamui-jsx = { workspace = true }
creamui-macros = { workspace = true }
creamui-reactive = { workspace = true }
creamui-widgets = { workspace = true }
serde = { workspace = true, features = ["derive"] }
