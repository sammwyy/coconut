[package]
name = "coconut-files"
version = "0.1.0"
edition = "2021"
description = "Coconut's file manager and FileChooser portal backend"
license = "Apache-2.0"
authors = ["Sammwy"]
repository = "https://github.com/sammwyy/creamshell"

[[bin]]
name = "cfiles"
path = "src/main.rs"

[dependencies]
dbus.workspace = true
url.workspace = true
libc.workspace = true
mime_guess.workspace = true
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
coconut-ui = { workspace = true }
delib = { workspace = true }
creamui-image = { workspace = true, features = ["svg"] }
creamui-core = { workspace = true }
creamui-reactive = { workspace = true }
creamui-render = { workspace = true, features = ["platform-wayland", "system-theme", "platform-window-integration-blair", "platform-blur-blair", "platform-blur-kwin"] }
creamui-theme = { workspace = true }
creamui-theme-loader = { workspace = true }
creamui-theme-watch = { workspace = true }
creamui-fonts = { workspace = true }
creamui-widgets = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
