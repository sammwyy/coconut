[package]
name = "coconut-files"
version.workspace = true
edition.workspace = true
description = "Coconut's file manager and FileChooser portal backend"
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "cfiles"
path = "src/main.rs"

[dependencies]
coconut-file-menu.workspace = true
coconut-thumbnails.workspace = true
coconut-integration-cream.workspace = true
dbus.workspace = true
url.workspace = true
libc.workspace = true
mime_guess.workspace = true
serde.workspace = true
toml.workspace = true
coconut-ui = { workspace = true }
delib = { workspace = true }
creamui-image = { workspace = true, features = ["svg"] }
creamui-core = { workspace = true }
creamui-reactive = { workspace = true }
creamui-render = { workspace = true, default-features = true, features = ["platform-wayland", "system-theme", "platform-window-integration-blair", "platform-blur-blair", "platform-blur-kwin"] }
creamui-theme = { workspace = true }
creamui-theme-loader = { workspace = true }
creamui-theme-watch = { workspace = true }
creamui-fonts = { workspace = true }
creamui-widgets = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
