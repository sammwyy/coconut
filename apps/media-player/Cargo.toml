[package]
name = "coconut-media-player"
version.workspace = true
edition.workspace = true
description = "Coconut's video and music player"
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "cplayer"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rodio.workspace = true
toml.workspace = true
libloading.workspace = true
discord-rich-presence.workspace = true
image = { workspace = true, default-features = false, features = ["jpeg"] }
coconut-ui = { workspace = true }
delib = { workspace = true }
creamui-image = { workspace = true, features = ["svg", "jpeg", "webp"] }
creamui-core = { workspace = true }
creamui-reactive = { workspace = true }
creamui-render = { workspace = true, default-features = false, features = ["system-theme", "logger"] }
creamui-theme = { workspace = true }
creamui-theme-loader = { workspace = true }
creamui-theme-watch = { workspace = true }
creamui-fonts = { workspace = true }
creamui-widgets = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
dbus.workspace = true
rfd = { workspace = true, default-features = false, features = ["xdg-portal"] }
creamui-render = { workspace = true, default-features = false, features = ["platform-winit", "platform-wayland", "platform-x11", "platform-window-integration-blair", "platform-blur-blair", "platform-blur-kwin", "tray"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { workspace = true, default-features = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
creamui-render = { workspace = true, default-features = false, features = ["platform-winit", "platform-windows"] }

[lints]
workspace = true
