[package]
name = "coconut-screenshots"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Coconut's interactive screenshot and annotation tool"

[[bin]]
name = "coconut-screenshots"
path = "src/main.rs"

[dependencies]
coconut-integration-cream.workspace = true
delib.workspace = true
creamui-core.workspace = true
creamui-reactive.workspace = true
creamui-theme.workspace = true
creamui-theme-watch.workspace = true
creamui-fonts.workspace = true
creamui-widgets.workspace = true
creamui-image = { workspace = true, features = ["svg"] }
creamui-render = { workspace = true, features = ["system-theme"] }
image = { workspace = true, features = ["png"] }
chrono.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
creamui-render = { workspace = true, features = ["platform-winit", "platform-wayland", "platform-x11", "platform-window-integration-blair", "platform-blur-blair", "platform-blur-kwin"] }
rfd = { workspace = true, features = ["xdg-portal"] }
arboard = { workspace = true, features = ["wayland-data-control"] }
wayland-client.workspace = true
smithay-client-toolkit.workspace = true
dbus.workspace = true
libc.workspace = true
x11rb.workspace = true
wayland-protocols = { workspace = true, features = ["unstable"] }
wayland-protocols-wlr.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { workspace = true, default-features = true }

[target.'cfg(target_os = "windows")'.dependencies]
creamui-render = { workspace = true, features = ["platform-windows"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
