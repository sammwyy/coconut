[package]
name = "coconut-settings"
version = "0.1.0"
edition = "2021"
description = "Coconut's settings window process"
license = "Apache-2.0"

[[bin]]
name = "coconut-settings"
path = "src/main.rs"

[dependencies]
coconut-core = { workspace = true }
coconut-api = { workspace = true }
coconut-registry = { workspace = true }
coconut-plugin-kit = { workspace = true }
coconut-plugin-tray = { workspace = true }
coconut-plugin-clock = { workspace = true }
coconut-plugin-app-launcher = { workspace = true }
blair-client = { workspace = true }
blair-protocol = { workspace = true }
creamui-core = { workspace = true }
creamui-fonts = { workspace = true }
creamui-image = { workspace = true, features = ["webp", "jpeg", "svg"] }
creamui-jsx = { workspace = true }
creamui-macros = { workspace = true }
creamui-router = { workspace = true }
percent-encoding.workspace = true
url.workspace = true
creamui-reactive = { workspace = true }
creamui-render = { workspace = true, features = ["platform-wayland", "system-theme", "platform-window-integration-blair", "platform-blur-blair", "platform-blur-kwin"] }
creamui-theme = { workspace = true }
creamui-theme-loader = { workspace = true }
creamui-widgets = { workspace = true }
image-rs.workspace = true
dbus.workspace = true
rfd.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt"] }
delib = { workspace = true }
