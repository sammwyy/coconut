[package]
name = "coconut-settings"
version = "0.1.0"
edition = "2021"
description = "Coconut's settings window process"
license = "Apache-2.0"

[[bin]]
name = "coconut-settings"
path = "src/main.rs"

[dependencies]
coconut-core = { path = "../../crates/core" }
blair-client = { path = "../../../blair/crates/client" }
blair-protocol = { path = "../../../blair/crates/protocol" }
creamui-core = { path = "../../../creamui/crates/core" }
creamui-image = { path = "../../../creamui/crates/image", features = ["webp", "jpeg", "svg"] }
creamui-jsx = { path = "../../../creamui/crates/jsx" }
creamui-macros = { path = "../../../creamui/crates/macros" }
creamui-reactive = { path = "../../../creamui/crates/reactive" }
creamui-render = { path = "../../../creamui/crates/render", features = ["platform-wayland", "system-theme"] }
creamui-theme = { path = "../../../creamui/crates/theme" }
creamui-theme-loader = { path = "../../../creamui/crates/theme-loader" }
creamui-widgets = { path = "../../../creamui/crates/widgets" }
image-rs = { package = "image", version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
dbus = "0.9"
rfd = "0.17"
toml = "0.9"
tokio = { version = "1", features = ["rt"] }
