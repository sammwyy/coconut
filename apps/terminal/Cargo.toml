[package]
name = "coconut-terminal"
version = "0.1.0"
edition = "2021"
description = "Coconut's terminal emulator"
license = "Apache-2.0"
authors = ["Sammwy"]
repository = "https://github.com/sammwyy/creamshell"

[[bin]]
name = "cterm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
portable-pty.workspace = true
swash.workspace = true
vt100.workspace = true
regex.workspace = true
arboard.workspace = true
coconut-ui = { workspace = true }
delib = { workspace = true }
creamui-core = { workspace = true }
creamui-reactive = { workspace = true }
creamui-render = { workspace = true, default-features = false, features = ["system-theme"] }
creamui-theme = { workspace = true }
creamui-theme-loader = { workspace = true }
creamui-theme-watch = { workspace = true }
creamui-fonts = { workspace = true }
creamui-widgets = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Linux keeps the Wayland backend, Blair/KWin blur and the Wayland clipboard.
# Those crates do not build on Windows. `default-features` stays off in every
# spec so `platform-winit` is not merged into the Windows build.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }
creamui-render = { workspace = true, default-features = false, features = ["platform-winit", "platform-wayland", "platform-window-integration-blair", "platform-blur-blair", "platform-blur-kwin"] }

[target.'cfg(target_os = "windows")'.dependencies]
creamui-render = { workspace = true, default-features = false, features = ["platform-windows"] }
