[package]
name = "coconut-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Coconut's text, code, Markdown and byte editor"

[[bin]]
name = "cedit"
path = "src/main.rs"

[dependencies]
coconut-integration-cream.workspace = true
creamui-core.workspace = true
creamui-reactive.workspace = true
creamui-theme.workspace = true
creamui-theme-watch.workspace = true
creamui-fonts.workspace = true
creamui-widgets.workspace = true
creamui-render = { workspace = true, features = ["system-theme"] }
unicode-width.workspace = true
ropey.workspace = true
pulldown-cmark.workspace = true
regex.workspace = true
arboard.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
creamui-render = { workspace = true, features = ["platform-winit", "platform-wayland", "platform-x11", "platform-window-integration-blair", "platform-blur-blair", "platform-blur-kwin"] }
rfd = { workspace = true, features = ["xdg-portal"] }
arboard = { workspace = true, features = ["wayland-data-control"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { workspace = true, default-features = true }

[target.'cfg(target_os = "windows")'.dependencies]
creamui-render = { workspace = true, features = ["platform-windows"] }

[lints]
workspace = true
