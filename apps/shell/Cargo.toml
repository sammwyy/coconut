[package]
name = "coconut-shell"
version = "0.1.0"
edition = "2021"
description = "Coconut's dock/bar process"
license = "Apache-2.0"

[[bin]]
name = "coconut"
path = "src/main.rs"

[dependencies]
coconut-api = { path = "../../crates/api" }
coconut-core = { path = "../../crates/core" }
chrono = "0.4"
creamui-core = { path = "../../../creamui/crates/core" }
creamui-image = { path = "../../../creamui/crates/image", features = ["webp", "jpeg", "svg"] }
creamui-jsx = { path = "../../../creamui/crates/jsx" }
creamui-macros = { path = "../../../creamui/crates/macros" }
creamui-reactive = { path = "../../../creamui/crates/reactive" }
creamui-render = { path = "../../../creamui/crates/render", features = ["platform-wayland"] }
creamui-theme = { path = "../../../creamui/crates/theme" }
creamui-widgets = { path = "../../../creamui/crates/widgets" }
resvg = "0.45.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
coconut-registry = { path = "../../crates/registry" }

[target.'cfg(target_os = "windows")'.dependencies]
coconut-registry = { path = "../../crates/registry", default-features = false, features = ["windows"] }
