[package]
name = "coconut-monitor"
version.workspace = true
edition.workspace = true
description = "Coconut's system monitor"
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "cmonitor"
path = "src/main.rs"

[dependencies]
coconut-integration-cream.workspace = true
libc.workspace = true
delib = { workspace = true }
creamui-core = { workspace = true }
creamui-reactive = { workspace = true }
creamui-render = { workspace = true, default-features = true, features = ["platform-wayland", "system-theme", "platform-window-integration-blair", "platform-blur-blair", "platform-blur-kwin"] }
creamui-router = { workspace = true }
creamui-theme = { workspace = true }
creamui-theme-loader = { workspace = true }
creamui-theme-watch = { workspace = true }
creamui-fonts = { workspace = true }
creamui-widgets = { workspace = true }

[lints]
workspace = true
