[package]
name = "coconut-monitor"
version = "0.1.0"
edition = "2021"
description = "Coconut's system monitor"
license = "Apache-2.0"
authors = ["Sammwy"]
repository = "https://github.com/sammwyy/creamshell"

[[bin]]
name = "cmonitor"
path = "src/main.rs"

[dependencies]
libc.workspace = true
delib = { workspace = true }
creamui-core = { workspace = true }
creamui-reactive = { workspace = true }
creamui-render = { workspace = true, features = ["platform-wayland", "system-theme", "platform-window-integration-blair", "platform-blur-blair", "platform-blur-kwin"] }
creamui-router = { workspace = true }
creamui-theme = { workspace = true }
creamui-theme-loader = { workspace = true }
creamui-theme-watch = { workspace = true }
creamui-fonts = { workspace = true }
creamui-widgets = { workspace = true }
