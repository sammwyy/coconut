[workspace]
resolver = "2"
members = ["crates/*", "integrations/*"]

[package]
name = "creamshell"
version = "0.1.0"
edition = "2021"
description = "A small, native Wayland dock built with CreamUI"
license = "Apache-2.0"

[[bin]]
name = "creamshell"
path = "src/main.rs"

[dependencies]
creamshell-shell = { path = "crates/shell" }
creamshell-settings-panel = { path = "crates/settings-panel" }

[profile.dev.package."*"]
opt-level = 2
