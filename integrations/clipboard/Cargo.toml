[package]
name = "coconut-integration-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Permission-controlled session clipboard service and client"

[[bin]]
name = "coconut-clipboard"
path = "src/main.rs"

[dependencies]
delib.workspace = true
libc.workspace = true
serde.workspace = true
toml.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
wayland-client.workspace = true
wayland-protocols-wlr.workspace = true
zbus = { workspace = true, features = ["blocking-api"] }

[lints]
workspace = true
